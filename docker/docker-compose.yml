version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ../storage:/app/storage
      - ../models:/app/models
    environment:
      - SIS_SECRET_KEY=sis-studio-production-key-2026-sohel
      - DATABASE_URL=sqlite:////app/storage/sis_studio.db
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
